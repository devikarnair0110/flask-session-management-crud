{% extends "base.html" %}

{% block content %}

<h2>Edit Student</h2>

<form method="POST">

    {{ form.hidden_tag() }}

    <p>
        {{ form.name.label }}
        {{ form.name() }}
    </p>

    <p>
        {{ form.email.label }}
        {{ form.email() }}
    </p>

    <p>
        {{ form.course.label }}
        {{ form.course() }}
    </p>

    <p>
        {{ form.submit(value="Update Student") }}
    </p>

</form>

{% endblock %}
