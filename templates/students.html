{% extends "base.html" %}

{% block content %}

<h2>Student List</h2>

<a href="{{ url_for('add_student') }}">
    Add New Student
</a>

<br><br>

<table>

    <tr>

        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Course</th>
        <th>Actions</th>

    </tr>

    {% for student in students %}

    <tr>

        <td>{{ student.id }}</td>

        <td>{{ student.name }}</td>

        <td>{{ student.email }}</td>

        <td>{{ student.course }}</td>

        <td>

            <a href="{{ url_for('edit_student', id=student.id) }}">
                Edit
            </a>

            |

            <a href="{{ url_for('delete_student', id=student.id) }}">
                Delete
            </a>

        </td>

    </tr>

    {% endfor %}

</table>

{% endblock %}
